<!DOCTYPE html>

<head>

                <li class=" py-7 group relative">

                <li class=" py-7 group relative">

            <div class="flex items-center gap-5 px-4 ">
                <img src="./images/Flag_of_India.svg.webp"
                class="w-10 h-7"
                alt=""/>

                <button class="text-white   px-3 py-1 border-solid border-[0.5px] rounded-sm  border-gray-50">Log in</button>
                <button class="text-lightBlue300 font-semibold  px-3 py-1 border-solid border-[0.5px] rounded-sm  bg-white hover:text-lightBlue500">Sign up</button>
